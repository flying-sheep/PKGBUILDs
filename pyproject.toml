[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling", "openapi-python-client" ]

[project]
name = "nvcheck"
description = "Run NVChecker on all PKGBUILD packages"
readme = "README.md"
license = "MIT"
authors = [ { name = "Philipp Angerer", email = "philipp.angerer@helmholtz-munich.de" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "attrs",                    # for generated client
  "githubkit",
  "httpx[brotli,http2,zstd]",
  "nvchecker[pypi]>=2.16",
  "packaging",
  "pyalpm",
  "pygit2",
  "srcinfo",
]
optional-dependencies.test = [ "pytest" ]
scripts.nvcheck = "nvcheck.main:main"

[tool.hatch]
version.source = "vcs"
build.hooks.custom = {}
build.targets.wheel.packages = [ "src/aurweb_client", "src/nvcheck" ]
envs.default.installer = "uv"
envs.default.extra-dependencies = [ "types-pygit2" ]
envs.default.scripts.pkg-add = "git subtree add -P pkgs/{args} ssh://aur@aur.archlinux.org/{args}.git master"
envs.default.scripts.pkg-pull = "git subtree pull -P pkgs/{args} ssh://aur@aur.archlinux.org/{args}.git master"
envs.default.scripts.pkg-push = """\
  git push ssh://aur@aur.archlinux.org/{args}.git $(splitsh-lite --prefix=pkgs/{args}):master\
  """

[tool.ruff]
src = [ "src" ]
format.docstring-code-format = true
lint.select = [
  "E",   # Error detected by Pycodestyle
  "F",   # Errors detected by Pyflakes
  "I",   # isort
  "ICN", # Follow import conventions
  "PLW", # Pylint
  "PT",  # Pytest conventions
  "PTH", # Pathlib instead of os.path
  "TC",  # manage type checking blocks
  "TID", # Banned imports
  "UP",  # pyupgrade
  "W",   # Warning detected by Pycodestyle
]
lint.ignore = [
  "TID252", # dot imports from parents are useful
]
lint.per-file-ignores."src/**" = [ "PT015" ]  # `assert False`
lint.flake8-type-checking.exempt-modules = []
lint.flake8-type-checking.strict = true
lint.isort.known-first-party = [ "nvcheck", "aurweb_client" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]

[tool.pytest]
addopts = [
  "--import-mode=importlib",
  "--doctest-modules",
  "--pyargs",
  "--ignore=hatch_build.py",
  "--ignore=pkgs",
]
filterwarnings = [ "error" ]
strict = true
